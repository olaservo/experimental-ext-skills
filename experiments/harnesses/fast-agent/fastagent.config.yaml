default_model: anthropic.claude-sonnet-4-6

logger:
  progress_display: false
  show_chat: true
  show_tools: true
  truncate_tools: true

mcp:
  servers:
    github_skills:
      transport: http
      url: http://localhost:8082/mcp
      headers:
        Authorization: "Bearer ${GITHUB_TOKEN}"
      # Contamination guarantee for the activation test: suppress the
      # server's `instructions` field from the system prompt so the model's
      # only signal that the pull-requests skill exists comes from the host's
      # `<available_skills>` block (built from `skill://index.json`).
      # If the model still calls `read_skill` with the skill:// URI and
      # surfaces SKILL.md-only method names, the activation went through the
      # SEP integration end-to-end, not via inlined server text.
      include_instructions: false
      # v2 of the fast-agent fork added a per-server SkillConsentStore that
      # holds discovered skills in a pending set until the user runs
      # `/skills approve <server>` in the REPL. The harness is headless, so
      # without this flag the `<available_skills>` catalog is empty and the
      # activation test always fails. Auto-approve mirrors the implicit
      # consent a user gives by configuring the server in the first place.
      skills_auto_approve: true

    hf_skills:
      transport: http
      url: https://huggingface.co/mcp
      headers:
        Authorization: "Bearer ${HF_TOKEN}"
      # Same contamination control as github_skills. Prod's instructions
      # field carries generic HF-tool guidance (no skills pointer), but
      # suppress it so the only activation signal is `<available_skills>`.
      include_instructions: false
      # NOTE: on evalstate/fast-agent main `skills_auto_approve` is a
      # no-op (the v2-fork consent-store auto-surfacing was never merged
      # upstream). Skills are NOT auto-surfaced from the server here —
      # the harness installs `mcp_server.install_skill` into a managed dir
      # and injects it into <available_skills> before the run (SEP-2640
      # registry/install scope). Kept for documentation; harmless.
      skills_auto_approve: true

    birch_skills:
      # Stdio transport — no transport: line; fast-agent infers stdio
      # from the presence of `command`. The wrapper lives in
      # olaservo/birch-html@add-mcp-server-wrapper; bootstrap.sh builds
      # mcp-server/dist/server.js into experiments/.workspace/birch-html/.
      # agent.py exports BIRCH_MCP_SERVER_DIST at module scope so this
      # ${VAR} resolves to an absolute path regardless of harness CWD.
      command: node
      args: ["${BIRCH_MCP_SERVER_DIST}"]
      # Same contamination controls as github_skills / hf_skills.
      include_instructions: false
      skills_auto_approve: true
