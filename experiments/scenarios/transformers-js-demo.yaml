# Scenario #4 — Transformers.js browser demo (read-only, code-output).
# See docs/findings/scenarios/transformers-js-demo.md for what this
# probes and why. Read-only — no hf_jobs / DRY_RUN dependency.

id: transformers-js-demo
description: >-
  Agent activates the `transformers-js` skill and produces a
  self-contained browser HTML/JS file using the @huggingface/transformers
  package. Read-only — no tool execution required; the artifact is the
  agent's final assistant response. Tests the SEP loading mechanism on
  a JavaScript-output skill, complementing the Python-output #2/#3.

mcp_server:
  endpoint: http://localhost:8083/mcp
  alias: hf_skills

# Natural request — no "read skills first" hint. Browser sentiment
# analysis is the canonical Transformers.js demo, in-domain for the
# skill's "When to Use" list.
prompt_template: >-
  Write a small self-contained HTML file that uses Transformers.js
  to run sentiment analysis on user input from a textarea, with a
  button to trigger inference and a place to render the result.

# fast-agent picks a variant via FAST_AGENT_VARIANT=anthropic|openai|google|openrouter
# (default: anthropic). The openai/google/openrouter entries are starting
# points sourced from the user's fast-agent quality benchmark and
# skilljack-evals CI — tune per scenario if a model fails activation.
#
# goose picks a variant via GOOSE_VARIANT=anthropic|openai|google|openrouter
# (default: anthropic). Models are bare ids — goose takes provider +
# model as separate CLI flags, so no `<provider>.` prefix. The `openai`
# variant auto-detects gpt-5+ models and routes them to /v1/responses
# transparently (`should_use_responses_api` in openai.rs:269); earlier
# models go through chat-completions. No Responses fallback needed.
models:
  fast-agent:
    anthropic: anthropic.claude-haiku-4-5-20251001
    openai:    responses.gpt-5.5
    google:    google.gemini-3.5-flash
    # OR alternates (override with FAST_AGENT_MODEL):
    #   openrouter.minimax/minimax-m2.7   (efficiency winner)
    #   openrouter.moonshotai/kimi-k2.6   (quality leader)
    #   openrouter.qwen/qwen3.7-max       (latest Qwen, max tier)
    #   openrouter.z-ai/glm-4.6           (Zhipu GLM, agentic coding focus)
    openrouter: openrouter.deepseek/deepseek-v4-pro
  goose:
    anthropic:  claude-sonnet-4-6
    openai:     gpt-5.5
    google:     gemini-3.5-flash
    # OR alternates (override with GOOSE_PROVIDER=openrouter GOOSE_MODEL=...):
    #   minimax/minimax-m2.7   (efficiency winner)
    #   moonshotai/kimi-k2.6   (quality leader)
    #   qwen/qwen3.7-max       (latest Qwen, max tier)
    #   z-ai/glm-4.6           (Zhipu GLM, agentic coding focus)
    openrouter: deepseek/deepseek-v4-pro
  codex: gpt-5.1-codex-mini
