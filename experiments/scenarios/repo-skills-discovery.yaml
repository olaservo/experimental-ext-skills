# Scenario #6 — per-repo resource-template skill discovery.
# See .claude/skills/run-scenario/scenarios/repo-skills-discovery.md for what
# this probes and why.
# Pre-req: github-mcp-server must run with --toolsets=all (or =skills) so the
# per-repo template `skill://{owner}/{repo}/{skill_name}/{+file_path}` and the
# `list_repo_skills` tool from PR #2428 are exposed. `--toolsets=default`
# excludes them and this scenario degenerates into a no-op.

id: repo-skills-discovery
description: >-
  Agent discovers and reads a skill from an *external* GitHub repo
  (`anthropics/skills`) via PR #2428's per-repo resource template
  `skill://{owner}/{repo}/{skill_name}/{+file_path}` and the companion
  `list_repo_skills` tool. Where pr-review exercises the bundled
  `skill://github/<name>/SKILL.md` namespace (28 SKILL.md files embedded
  in the binary), this scenario exercises the cross-repo template path —
  the full SEP-2640 autonomous-discovery loop end-to-end.

mcp_server:
  endpoint: http://localhost:8082/mcp
  alias: github_skills

# Natural product request — names the target repo so the agent knows
# where to look, but does NOT name the skill, so it must enumerate
# (list_repo_skills) or guess a URI. Either path exercises the
# per-repo template; we log which one the model picks per client.
#
# Why pptx and not pdf: the pdf SKILL.md references its companion
# files in uppercase (`FORMS.md`, `REFERENCE.md`) but the actual files
# on disk are lowercase. Agents that follow the SKILL.md text faithfully
# get 404s from the case-sensitive GitHub Contents API, which masks
# whether the per-repo template *itself* works. pptx has consistent
# lowercase references (`editing.md`, `pptxgenjs.md`) — same template
# mechanics, no upstream content quirk in the way.
prompt_template: >-
  I need to programmatically generate a slide deck presenting quarterly
  business metrics — title slide, KPI tables, and a couple of chart
  slides. Check the skills available in the `anthropics/skills` GitHub
  repository, pick the one that best fits this task, read its
  documentation (including any referenced files), and outline an
  implementation plan based on what the skill recommends.

# Per-client model identifiers — same policy as pr-review: smallest
# tier per client that reliably activates a skill, so we measure the
# SEP discovery primitive rather than raw capability. Per-repo template
# is a newer surface than bundled skills; if a model fails to invoke
# `list_repo_skills` or guesses the URI shape, bump one tier.
#
# fast-agent picks a variant via FAST_AGENT_VARIANT=anthropic|openai|google|openrouter
# (default: anthropic). The openai/google/openrouter entries are starting
# points sourced from the user's fast-agent quality benchmark and
# skilljack-evals CI — tune per scenario if a model fails activation.
#
# goose picks a variant via GOOSE_VARIANT=anthropic|openai|google|openrouter
# (default: anthropic). Models are bare ids — goose takes provider +
# model as separate CLI flags, so no `<provider>.` prefix. The `openai`
# variant auto-detects gpt-5+ models and routes them to /v1/responses
# transparently (`should_use_responses_api` in openai.rs:269); earlier
# models go through chat-completions. No Responses fallback needed.
models:
  fast-agent:
    anthropic: anthropic.claude-haiku-4-5-20251001
    openai:    responses.gpt-5.5
    google:    google.gemini-3.5-flash
    # OR alternates (override with FAST_AGENT_MODEL):
    #   openrouter.minimax/minimax-m2.7   (efficiency winner)
    #   openrouter.moonshotai/kimi-k2.6   (quality leader)
    #   openrouter.qwen/qwen3.7-max       (latest Qwen, max tier)
    #   openrouter.z-ai/glm-4.6           (Zhipu GLM, agentic coding focus)
    openrouter: openrouter.deepseek/deepseek-v4-pro
  goose:
    anthropic:  claude-sonnet-4-6
    openai:     gpt-5.5
    google:     gemini-3.5-flash
    # OR alternates (override with GOOSE_PROVIDER=openrouter GOOSE_MODEL=...):
    #   minimax/minimax-m2.7   (efficiency winner)
    #   moonshotai/kimi-k2.6   (quality leader)
    #   qwen/qwen3.7-max       (latest Qwen, max tier)
    #   z-ai/glm-4.6           (Zhipu GLM, agentic coding focus)
    openrouter: deepseek/deepseek-v4-pro
  codex: gpt-5.1-codex
